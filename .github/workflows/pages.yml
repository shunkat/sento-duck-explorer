name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - name: Check source for publication
        run: python3 scripts/check-publication.py
      - name: Check deployment cutoff behavior
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm ci
      - run: npm test
      - name: Build for the repository URL
        run: npm run build -- --base=/sento-duck-explorer/
      - name: Record the built revision
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('dist/version.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA']}) + '\n')
          PY
      - name: Check distribution for publication
        run: python3 scripts/check-publication.py --root dist
      - name: Check publication window
        id: window
        run: python3 scripts/deployment_window.py >> "$GITHUB_OUTPUT"
      - name: Upload the checked distribution
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.window.outputs.allowed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 7
    outputs:
      publication_allowed: ${{ steps.window.outputs.allowed }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.publication_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Confirm this is still the latest main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" == "$latest_sha" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping an outdated revision; a newer main must pass its own checks.'
          fi
      - name: Recheck the time immediately before deployment
        id: window
        run: python3 scripts/deployment_window.py >> "$GITHUB_OUTPUT"
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.revision.outputs.current == 'true' && steps.window.outputs.allowed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: '600000'
