<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2330" />
    <title>アヒルと子どもと大人の銭湯探検</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2330; font-family: system-ui, "Hiragino Sans", sans-serif; }
      #app { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #app canvas { display: block; touch-action: none; }
      #hud { position: fixed; inset: 0; z-index: 4; pointer-events: none; color: #fff; font-size: 13px; line-height: 1.55; }
      #hud > div { position: absolute; box-sizing: border-box; background: rgba(0,0,0,0.62); border-radius: 6px; padding: 8px 12px; white-space: pre-wrap; }
      .hud-status { top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); font-size: 12px; }
      .hud-hints { bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 190px); text-align: center; color: #e9fbef; }
      .hud-hints:empty { display: none; }
      .hud-toast { bottom: max(140px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 40px); font-size: 14px; text-align: center; transition: opacity 0.3s; }
      .hud-dev { bottom: 70px; left: 10px; color: #f88; font-size: 11px; }
      .hud-dev:empty { display: none; }
      #hud > .hud-overlay { inset: 0; display: none; align-items: center; flex-direction: column; text-align: center; background: rgba(10,15,25,0.72); border-radius: 0; font-size: 16px; z-index: 4; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      /* Safe centring: centred when it fits, scrollable from the top when it does not. */
      #hud > .hud-overlay > :first-child, #hud > .hud-pause > :first-child { margin-top: auto; }
      #hud > .hud-overlay > :last-child, #hud > .hud-pause > :last-child { margin-bottom: auto; }
      .hud-overlay.dialog { background: rgba(10,15,25,0.45); }
      .hud-overlay h2 { margin: 0 0 12px; font-size: 26px; }
      .hud-overlay .reason { font-size: 20px; color: #ffb4a8; }
      .hud-overlay .speech { font-size: 18px; color: #fff3c4; }
      .hud-overlay .small { font-size: 12px; color: #ccc; }
      .hud-overlay .key { margin-top: 16px; font-size: 18px; color: #ffe27a; }
      .hud-overlay.cleared h2 { color: #ffe27a; }
      .hud-settings-button, .hud-settings-close { min-width: 64px; min-height: 44px; padding: 8px 16px; border: 1px solid #abc8bb; border-radius: 8px; background: #183b36ed; color: #fff; font: inherit; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
      .hud-settings-button { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); }
      .hud-settings-button:focus-visible, .hud-settings-close:focus-visible, .hud-settings-dialog summary:focus-visible, .hud-settings-dialog input:focus-visible { outline: 3px solid #ffe27a; outline-offset: 4px; }
      .hud-settings-dialog { box-sizing: border-box; width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); overflow: auto; border: 1px solid #abc8bb; border-radius: 16px; padding: 24px; color: #f2f7f2; background: #16322f; pointer-events: auto; }
      .hud-settings-dialog::backdrop { background: #081c20b8; }
      .hud-settings-dialog h2 { margin: 0 0 20px; font-size: 22px; }
      .hud-help-toggle { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; font-size: 16px; }
      .hud-help-toggle input { width: 22px; height: 22px; accent-color: #d4efbd; }
      .hud-controls { margin: 20px 0; color: #d1dfd5; }
      .hud-controls summary { padding: 10px 0; cursor: pointer; }
      .hud-controls p { white-space: pre-line; line-height: 1.8; font-size: 13px; }
      .hud-settings-close { width: 100%; }
      @media (max-width: 520px) {
        .hud-hints { bottom: max(70px, env(safe-area-inset-bottom)); max-width: calc(100% - 24px); font-size: 12px; }
        .hud-overlay { box-sizing: border-box; padding: 20px; }
        .hud-overlay p { margin: 8px 0; }
      }

      /* Prompt, load status and pause overlay */
      .hud-prompt { bottom: max(64px, calc(env(safe-area-inset-bottom) + 12px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); text-align: center; color: #fff6c8; border: 1px solid #ffe27a; }
      .hud-prompt[hidden], .hud-load[hidden] { display: none; }
      .hud-load { top: max(44px, calc(env(safe-area-inset-top) + 32px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); font-size: 12px; text-align: center; }
      .hud-load:empty { display: none; }
      #hud > .hud-pause { inset: 0; display: none; align-items: center; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; text-align: center; background: rgba(10,15,25,0.82); border-radius: 0; font-size: 16px; padding: 24px; pointer-events: auto; z-index: 5; }
      .hud-pause h2 { margin: 0 0 12px; font-size: 24px; }
      .hud-pause p { max-width: 28em; margin: 6px 0 16px; }
      .hud-big-button { min-width: 160px; min-height: 56px; padding: 12px 24px; margin-top: 12px; border: 2px solid #ffe27a; border-radius: 12px; background: #183b36; color: #fff; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
      .hud-big-button:focus-visible { outline: 3px solid #ffe27a; outline-offset: 4px; }
      .hud-overlay { pointer-events: none; }
      #hud > .hud-overlay[style*="flex"] { pointer-events: auto; }
      .hud-sensitivity { gap: 12px; }
      .hud-sensitivity input[type="range"] { flex: 1; min-width: 0; width: auto; height: 32px; }
      .hud-settings-dialog { touch-action: pan-y; overscroll-behavior: contain; }
      /* Touch controls. Game surface is touch-action:none; dialogs scroll. */
      #touch { position: fixed; inset: 0; pointer-events: none; z-index: 2; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #touch[hidden] { display: none; }
      .touch-pad { position: absolute; left: max(12px, calc(env(safe-area-inset-left) + 12px)); bottom: max(12px, calc(env(safe-area-inset-bottom) + 12px)); width: 112px; height: 112px; border-radius: 50%; border: 2px solid #ffffffa0; background: rgba(15,35,38,0.45); pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center; }
      .touch-knob { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,246,200,0.85); box-shadow: 0 2px 8px #0006; pointer-events: none; }
      .touch-actions { position: absolute; right: max(12px, calc(env(safe-area-inset-right) + 12px)); bottom: max(12px, calc(env(safe-area-inset-bottom) + 12px)); display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 8px; pointer-events: none; }
      .touch-btn { min-width: 48px; min-height: 48px; padding: 8px 14px; border: 1px solid #abc8bb; border-radius: 12px; background: #183b36ee; color: #fff; font: inherit; font-size: 14px; line-height: 1.2; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
      .touch-btn[hidden] { display: none; }
      .touch-btn:focus-visible { outline: 3px solid #ffe27a; outline-offset: 3px; }
      .touch-primary { min-width: 64px; min-height: 64px; max-width: 150px; font-size: 15px; font-weight: 700; border-color: #ffe27a; }
      .touch-primary[data-has-target="false"] { opacity: 0.8; border-color: #abc8bb; }
      .touch-run[aria-pressed="true"] { background: #7a4a12; border-color: #ffe27a; }
      .touch-menu { box-sizing: border-box; width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); overflow: auto; touch-action: pan-y; overscroll-behavior: contain; border: 1px solid #abc8bb; border-radius: 16px; padding: 16px; background: #16322f; color: #f2f7f2; pointer-events: auto; }
      .touch-menu::backdrop { background: #081c20b8; }
      .touch-menu-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
      .touch-menu .touch-btn { width: 100%; }
      @media (orientation: landscape) { .touch-actions { flex-direction: row-reverse; align-items: flex-end; } }
      body.touch .hud-hints { display: none; }
      body.touch .hud-settings-button { left: max(12px, calc(env(safe-area-inset-left) + 12px)); bottom: auto; top: max(52px, calc(env(safe-area-inset-top) + 52px)); min-width: 48px; min-height: 48px; }
      body.touch .hud-toast { bottom: max(300px, calc(env(safe-area-inset-bottom) + 300px)); }
      body.touch .hud-prompt { bottom: max(256px, calc(env(safe-area-inset-bottom) + 256px)); }
      body.touch .minimap-close, body.touch .hud-settings-close { min-height: 48px; }
      @media (orientation: landscape) and (max-height: 450px) {
        body.touch .hud-prompt { bottom: max(92px, calc(env(safe-area-inset-bottom) + 92px)); }
        body.touch .hud-toast { bottom: max(136px, calc(env(safe-area-inset-bottom) + 136px)); }
        .touch-pad { width: 104px; height: 104px; }
      }
      @media (orientation: landscape) and (max-height: 450px) and (max-width: 640px) {
        .touch-btn { padding: 6px 10px; font-size: 13px; }
      }
      .credits { position: fixed; top: 10px; right: 10px; z-index: 1; padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.72); color: #ddd; font-size: 11px; }
      #map { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
      .minimap-button { position: absolute; top: max(44px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: clamp(180px, 23vw, 260px); padding: 10px; border: 1px solid #9fc4b8; border-radius: 12px; background: rgba(20,42,46,.94); color: #f0faf6; box-shadow: 0 4px 18px #0004; font: inherit; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
      .minimap-button:hover { background: #234e50; border-color: #fff4bc; }
      .minimap-button:focus-visible, .minimap-close:focus-visible { outline: 3px solid #ffdd71; outline-offset: 3px; }
      .minimap-button .minimap-title { display: block; font-size: 13px; font-weight: 700; text-align: left; }
      .minimap-north { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 400; color: #bcd9d2; }
      .minimap-caption { display: block; font-size: 11px; line-height: 1.5; color: #c7e5df; text-align: right; }
      .minimap-svg { display: block; width: 100%; height: auto; min-height: 0; border-radius: 7px; background: #edf3e8; }
      .minimap-button .minimap-svg { margin: 7px 0; pointer-events: none; }
      .minimap-button .minimap-labels { display: none; }
      .minimap-dialog { position: fixed; inset: 0; box-sizing: border-box; width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; margin: 0; border: 0; padding: max(18px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #122a30; color: #eff7ef; pointer-events: auto; }
      .minimap-dialog[open] { display: flex; flex-direction: column; gap: 14px; }
      .minimap-dialog::backdrop { background: #122a30; }
      .minimap-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex: 0 0 auto; }
      .minimap-header .minimap-title { font-size: clamp(18px, 3vw, 26px); font-weight: 700; margin: 0; }
      .minimap-close { min-height: 44px; padding: 10px 18px; flex-shrink: 0; border: 1px solid #c6ded2; border-radius: 8px; color: #f4f8ed; background: #315651; font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation; }
      .minimap-close:hover { background: #426c62; }
      .minimap-dialog > .minimap-svg, .minimap-body { flex: 1 1 0; min-height: 0; width: 100%; }
      .minimap-body { display: flex; }
      .minimap-body > .minimap-svg { flex: 1; height: 100%; }
      .minimap-dialog > .minimap-svg { height: 100%; }
      .minimap-legend { flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.6; color: #d9e9df; }
      .minimap-legend-item { display: flex; align-items: center; gap: 7px; }
      .minimap-swatch { display: inline-block; box-sizing: border-box; width: 12px; height: 12px; border: 1px solid #ffffff80; border-radius: 2px; }
      .minimap-legend-player { background: #e0442c; clip-path: polygon(50% 0,100% 100%,50% 76%,0 100%); }
      .minimap-legend-milk { background: #fff; border: 3px solid #1f6fb2; border-radius: 50%; }
      .minimap-legend-indoor { background: #f3e7cf; }
      .minimap-legend-outdoor { background: #cfe3c4; }
      .minimap-legend-water { background: #9acfd9; }
      .minimap-legend-door { background: #b0413e; }
      .minimap-note { margin: 0; flex: 0 0 auto; text-align: center; color: #bcd9d2; font-size: 12px; }
      @media (max-width: 900px) {
        .hud-status { max-width: calc(100vw - 215px); font-size: 11px; }
        .minimap-button { width: 178px; }
      }
      @media (max-width: 520px) {
        .credits { max-width: 130px; font-size: 9px; }
        .minimap-button { top: max(42px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); width: 142px; padding: 7px; }
        .minimap-button .minimap-title { font-size: 11px; }
        .minimap-north { top: 7px; right: 7px; font-size: 9px; }
        .minimap-caption { font-size: 9px; }
        .hud-status { max-width: calc(100vw - 182px); max-height: 160px; overflow: hidden; font-size: 10px; }
        .hud-toast { bottom: 185px; width: calc(100% - 44px); text-align: center; }
        .minimap-dialog { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
        .minimap-dialog[open] { gap: 10px; }
        .minimap-legend { font-size: 11px; }
        .minimap-label { font-size: 1.2px; }
      }
      @media (max-height: 450px) {
        .hud-overlay h2, .hud-pause h2 { margin: 0 0 6px; font-size: 20px; }
        .hud-overlay, .hud-pause { font-size: 14px; }
        .hud-overlay p, .hud-pause p { margin: 4px 0; }
        .hud-overlay .reason { font-size: 16px; }
        .hud-overlay .speech { font-size: 15px; }
        .hud-big-button { margin-top: 8px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="map"></div>
    <div id="touch" hidden></div>
    <a class="credits" href="%BASE_URL%THIRD_PARTY_NOTICES.md" target="_blank" rel="noopener">素材・ライセンス / Credits</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
